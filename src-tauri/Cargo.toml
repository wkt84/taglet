[package]
name = "taglet"
version = "0.2.0"
description = "A DICOM tag editor"
authors = ["Akihisa Wakita"]
edition = "2021"

[lib]
name = "taglet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
base64 = "0.22"
dicom-core = "0.7"
encoding_rs = "0.8"
flate2 = "1"
dicom-dictionary-std = "0.7"
dicom-encoding = "0.7"
dicom-object = "0.7"
dicom-parser = "0.7"
dicom-transfer-syntax-registry = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
xattr = "1"
