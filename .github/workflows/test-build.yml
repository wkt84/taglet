name: Test Build (Windows)

# Windows builds for testing, separate from releases: no tag, no release, no updater
# files. Run it from the Actions tab ("Run workflow", then pick a branch), or add the
# "build:windows" label to a pull request (later pushes to it build again while the
# label stays). The installers are attached to the run as an artifact.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

# A newer build for the same pull request or branch replaces a running one. Events
# that do not build (e.g. another label added) get a group of their own, so that
# they never cancel a running build.
concurrency:
  group: >-
    test-build-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event_name == 'workflow_dispatch' ||
    (github.event.action == 'labeled' && github.event.label.name == 'build:windows') ||
    (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build:windows')))
    && 'build' || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build:windows') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build:windows'))
    runs-on: windows-latest
    steps:
      # The pull request's own head commit, not the merge with the base branch, so
      # that the build matches the commit it is named after.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build:windows') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build:windows'))
    runs-on: windows-latest
    steps:
      # The pull request's own head commit, not the merge with the base branch, so
      # that the build matches the commit it is named after.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Updater files need the release signing key, and test builds should not be
      # offered as updates anyway.
      - name: Build Tauri app
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/test-build.json"
          npm run tauri -- build --config "$RUNNER_TEMP/test-build.json"

      - name: Name the artifact
        id: name
        shell: bash
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "artifact=taglet-windows-test-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
